# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js project to Azure Function App - rolfs-weihnachten

on:
  push:
    branches:
      - main
      - new
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.' # set this to the path to your web app project, defaults to the repository root
  NODE_VERSION: '20.x' # align CI node version with commonly supported Azure Functions runtime

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout
      
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }} Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 'Resolve Project Dependencies Using Npm'
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present
          npm prune --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            host.json
            package.json
            package-lock.json
            dist
            node_modules

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9639C50A06DA4B82B534CFC4B983A5DE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2FED13546DE647F6926A2A5EF21A731C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A2F4B073810C413582365E8C2CD88E7F }}

      - name: Set Function App settings
        uses: azure/appservice-settings@v1
        with:
          app-name: 'rolfs-weihnachten'
          app-settings-json: |
            [
              {
                "name": "FUNCTIONS_WORKER_RUNTIME",
                "value": "node",
                "slotSetting": false
              },
              {
                "name": "AzureWebJobsStorage",
                "value": "${{ secrets.AZUREWEBJOBSSTORAGE }}",
                "slotSetting": false
              },
              {
                "name": "TABLE_NAME",
                "value": "feedback",
                "slotSetting": false
              },
              {
                "name": "TABLES_CONNECTION_STRING",
                "value": "${{ secrets.TABLES_CONNECTION_STRING }}",
                "slotSetting": false
              },
              {
                "name": "ROLFSURL",
                "value": "${{ secrets.ROLFSURL }}",
                "slotSetting": false
              }
            ]
      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'rolfs-weihnachten'
          slot-name: 'Production'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          